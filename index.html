<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Implementor Moka</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: #ffffff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 32px; width: 100%; max-width: 420px; }
    .title { text-align: center; font-size: 24px; font-weight: 700; color: #1e293b; margin-bottom: 4px; }
    .subtitle { text-align: center; font-size: 14px; color: #64748b; margin-bottom: 24px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px; }
    input { width: 100%; padding: 12px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; transition: all 0.2s; }
    input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
    .btn { width: 100%; padding: 12px; background-color: #1d4ed8; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px; }
    .btn:hover { background-color: #1e40af; }
    .btn:disabled { background-color: #94a3b8; cursor: not-allowed; }
    .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid #ffffff; border-radius: 50%; border-top-color: transparent; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="card">
    <h1 class="title">Moka Deployment</h1>
    <p class="subtitle">Portal Implementor Lapangan</p>
    
    <form id="loginForm">
      <div class="form-group">
        <label for="implId">Implementor ID</label>
        <input type="text" id="implId" placeholder="Contoh: MTI0888" required autocomplete="off">
      </div>
      
      <div class="form-group">
        <label for="email">Email Terdaftar</label>
        <input type="email" id="email" placeholder="email@contoh.com" required autocomplete="off">
      </div>
      
      <button type="submit" id="submitBtn" class="btn">
        <span id="btnText">Masuk & Lihat Dashboard</span>
      </button>
    </form>
  </div>

  <script>
    // URL Web App Google Apps Script Kamu
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbymM5-j2SrCJWtwb_ISnibC0nmBuyT0d2bvXP0s7lbar6fvTs5mjIuk_Yc6Hpok_N-mBw/exec";

    const loginForm = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const implId = document.getElementById('implId').value.trim();
      const email = document.getElementById('email').value.trim();

      if (!implId || !email) {
        alert("Harap isi Implementor ID dan Email!");
        return;
      }

      // Tampilkan status Loading
      setLoading(true);

      try {
        // Gunakan POST dengan text/plain untuk bypass kendala CORS Google Apps Script
        const response = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify({
            action: "getAssignedStores",
            implId: implId,
            email: email
          }),
          redirect: "follow"
        });

        const textResponse = await response.text();
        let result;
        
        try {
          result = JSON.parse(textResponse);
        } catch (err) {
          throw new Error("Gagal memproses data dari server. Pastikan Deployment ID sudah diset ke 'Anyone'.");
        }

        if (result.status === "success") {
          // Simpan data login di SessionStorage
          sessionStorage.setItem("userSession", JSON.stringify({
            implId: implId,
            email: email,
            stores: result.data
          }));

          alert(`Login Berhasil! Ditemukan ${result.data.length} toko.`);
          console.log("Data Toko Ter-assign:", result.data);
          
          // Arahkan ke dashboard jika file dashboard.html ada
          // window.location.href = "dashboard.html";
        } else {
          alert("Gagal Login: " + result.message);
        }

      } catch (error) {
        console.error("Login Error:", error);
        alert("Terjadi kesalahan sistem: " + error.message);
      } finally {
        setLoading(false);
      }
    });

    function setLoading(isLoading) {
      if (isLoading) {
        submitBtn.disabled = true;
        btnText.innerHTML = '<div class="spinner"></div> Memuat Data...';
      } else {
        submitBtn.disabled = false;
        btnText.innerHTML = 'Masuk & Lihat Dashboard';
      }
    }
  </script>
</body>
</html>
