<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Implementor Lapangan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen font-sans">

  <!-- ALERT NOTIFICATION -->
  <div id="alertBox" class="hidden fixed top-4 right-4 left-4 md:left-auto md:w-96 z-50 p-4 rounded-xl shadow-lg transition-all duration-300">
    <div class="flex items-center gap-3">
      <i id="alertIcon" class="fa-solid fa-circle-info text-xl"></i>
      <div id="alertMessage" class="text-sm font-medium"></div>
    </div>
  </div>

  <!-- LOGIN SECTION -->
  <div id="loginSection" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-200">
      <div class="text-center mb-6">
        <div class="bg-blue-100 text-blue-600 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl font-bold">
          <i class="fa-solid fa-user-gear"></i>
        </div>
        <h1 class="text-2xl font-bold text-slate-900">Portal Implementor</h1>
        <p class="text-slate-500 text-sm mt-1">Masuk dengan ID & Email terdaftar Anda</p>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Implementor ID</label>
          <input type="text" id="loginImplId" required placeholder="Contoh: MTI0888" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:outline-none uppercase">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Email Terdaftar</label>
          <input type="email" id="loginEmail" required placeholder="nama@email.com" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>
        <button type="submit" id="btnLogin" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl shadow-md transition-all flex justify-center items-center gap-2">
          <span>Masuk Portal</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>
    </div>
  </div>

  <!-- DASHBOARD SECTION -->
  <div id="dashboardSection" class="hidden min-h-screen pb-12">
    <nav class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
      <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
        <div class="flex items-center gap-3">
          <div class="bg-blue-600 text-white w-10 h-10 rounded-xl flex items-center justify-center font-bold">
            <i class="fa-solid fa-store"></i>
          </div>
          <div>
            <h2 id="userDisplayName" class="font-bold text-slate-900 text-sm md:text-base">-</h2>
            <p id="userDisplayId" class="text-xs text-slate-500">-</p>
          </div>
        </div>
        <button onclick="handleLogout()" class="text-xs font-bold text-red-600 bg-red-50 px-3 py-2 rounded-lg hover:bg-red-100 transition-all flex items-center gap-1.5">
          <i class="fa-solid fa-right-from-bracket"></i>
          <span>Keluar</span>
        </button>
      </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 mt-6">
      <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
        <div>
          <h1 class="text-xl md:text-2xl font-bold text-slate-900">Daftar Penugasan Toko</h1>
          <p class="text-xs md:text-sm text-slate-500">Kunjungan, BAST, dan Klaim Travel Fee</p>
        </div>
        <input type="text" id="searchInput" oninput="renderStoreList()" placeholder="🔍 Cari toko / kode toko..." class="w-full md:w-72 px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
      </div>

      <div id="storeListGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <!-- Rendered via JS -->
      </div>
    </div>
  </div>

  <!-- MODAL ABSEN VISIT -->
  <div id="modalAbsen" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
      <div class="p-4 bg-slate-900 text-white flex justify-between items-center">
        <h3 class="font-bold"><i class="fa-solid fa-location-dot text-blue-400 mr-2"></i>Absen Visit Lapangan</h3>
        <button onclick="closeModal('modalAbsen')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>
      <form id="formAbsen" onsubmit="submitAbsen(event)" class="p-6 space-y-4 overflow-y-auto">
        <input type="hidden" id="absenStoreCode"><input type="hidden" id="absenStoreName"><input type="hidden" id="absenOid">
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Tanggal Visit</label>
          <input type="date" id="absenWorkingDate" required class="w-full px-3 py-2 border rounded-xl text-sm">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Aktivitas</label>
          <select id="absenActivity" class="w-full px-3 py-2 border rounded-xl text-sm">
            <option value="Visit Lapangan">Visit Lapangan</option>
            <option value="Pemasangan Perangkat">Pemasangan Perangkat</option>
            <option value="Maintenance / Troubleshooting">Maintenance / Troubleshooting</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Catatan Visit</label>
          <textarea id="absenNotes" rows="2" placeholder="Tuliskan kendala atau progres..." class="w-full px-3 py-2 border rounded-xl text-sm"></textarea>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Foto Bukti Visit</label>
          <input type="file" id="absenPhoto" accept="image/*" required class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
        </div>
        <button type="submit" id="btnSubmitAbsen" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700 transition-all">Kirim Absen</button>
      </form>
    </div>
  </div>

  <!-- MODAL BAST -->
  <div id="modalBAST" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-xl rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
      <div class="p-4 bg-slate-900 text-white flex justify-between items-center">
        <h3 class="font-bold"><i class="fa-solid fa-file-contract text-emerald-400 mr-2"></i>Form BAST & Perangkat</h3>
        <button onclick="closeModal('modalBAST')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>
      <form id="formBAST" onsubmit="submitBAST(event)" class="p-6 space-y-4 overflow-y-auto">
        <input type="hidden" id="bastStoreCode"><input type="hidden" id="bastStoreName"><input type="hidden" id="bastOid">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">Nama Owner / Kasir</label>
            <input type="text" id="bastMerchantName" required class="w-full px-3 py-2 border rounded-xl text-sm">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">No HP Owner</label>
            <input type="tel" id="bastMerchantPhone" required class="w-full px-3 py-2 border rounded-xl text-sm">
          </div>
        </div>
        <div class="grid grid-cols-3 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">Email</label>
            <input type="email" id="bastMerchantEmail" class="w-full px-3 py-2 border rounded-xl text-sm">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">Gender</label>
            <select id="bastMerchantGender" class="w-full px-3 py-2 border rounded-xl text-sm">
              <option value="Laki-laki">Laki-laki</option>
              <option value="Perempuan">Perempuan</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">Umur</label>
            <input type="number" id="bastMerchantAge" placeholder="30" class="w-full px-3 py-2 border rounded-xl text-sm">
          </div>
        </div>
        <hr class="my-2">
        <div class="grid grid-cols-3 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">IMEI Perangkat</label>
            <input type="text" id="bastImei" class="w-full px-3 py-2 border rounded-xl text-sm">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">SN Scanner</label>
            <input type="text" id="bastScannerSn" class="w-full px-3 py-2 border rounded-xl text-sm">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">SN Printer</label>
            <input type="text" id="bastPrinterSn" class="w-full px-3 py-2 border rounded-xl text-sm">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">Foto Depan Toko</label>
            <input type="file" id="bastPhotoStore" accept="image/*" required class="w-full text-xs">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">Dokumen BAST TTD</label>
            <input type="file" id="bastFile" required class="w-full text-xs">
          </div>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Tanggal Visit BAST</label>
          <input type="date" id="bastVisitDate" required class="w-full px-3 py-2 border rounded-xl text-sm">
        </div>
        <button type="submit" id="btnSubmitBAST" class="w-full bg-emerald-600 text-white font-bold py-3 rounded-xl hover:bg-emerald-700 transition-all">Simpan BAST</button>
      </form>
    </div>
  </div>

  <!-- MODAL TRAVEL FEE -->
  <div id="modalTravel" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
      <div class="p-4 bg-slate-900 text-white flex justify-between items-center">
        <h3 class="font-bold"><i class="fa-solid fa-car text-amber-400 mr-2"></i>Klaim Travel Fee</h3>
        <button onclick="closeModal('modalTravel')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>
      <form id="formTravel" onsubmit="submitTravelFee(event)" class="p-6 space-y-4 overflow-y-auto">
        <input type="hidden" id="travelStoreCode"><input type="hidden" id="travelStoreName"><input type="hidden" id="travelStoreAddress">
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Alamat Domisili Implementor</label>
          <input type="text" id="travelImplAddress" required placeholder="Jln. Kebon Jeruk No. 12..." class="w-full px-3 py-2 border rounded-xl text-sm">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Kota Domisili</label>
          <input type="text" id="travelImplCity" required placeholder="Jakarta Barat" class="w-full px-3 py-2 border rounded-xl text-sm">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">Jarak (Km)</label>
            <input type="number" step="0.1" id="travelDistance" required placeholder="15" class="w-full px-3 py-2 border rounded-xl text-sm">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">Proposal Budget (Rp)</label>
            <input type="number" id="travelBudget" required placeholder="50000" class="w-full px-3 py-2 border rounded-xl text-sm">
          </div>
        </div>
        <button type="submit" id="btnSubmitTravel" class="w-full bg-amber-600 text-white font-bold py-3 rounded-xl hover:bg-amber-700 transition-all">Ajukan Travel Fee</button>
      </form>
    </div>
  </div>

  <script>
    // URL WEBAPP APPSCRIPT TERBARU
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyUAms-3UdlU4Jv1nbmUXTGNa2vMuR1iVNd8seQLf0x26Wow9NVjnWV6X1jff1wgmzt/exec";

    let state = { implId: "", email: "", userName: "", stores: [] };

    function showAlert(msg, isSuccess = true) {
      const box = document.getElementById("alertBox");
      document.getElementById("alertIcon").className = isSuccess ? "fa-solid fa-circle-check text-xl" : "fa-solid fa-triangle-exclamation text-xl";
      document.getElementById("alertMessage").innerText = msg;
      box.className = `fixed top-4 right-4 left-4 md:left-auto md:w-96 z-50 p-4 rounded-xl shadow-lg transition-all duration-300 ${isSuccess ? 'bg-emerald-500 text-white' : 'bg-red-500 text-white'}`;
      box.classList.remove("hidden");
      setTimeout(() => box.classList.add("hidden"), 4000);
    }

    const toBase64 = file => new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result);
      reader.onerror = error => reject(error);
    });

    // LOGIN CEPAT (1-2 DETIK)
    async function handleLogin(e) {
      e.preventDefault();
      const implId = document.getElementById("loginImplId").value.trim().toUpperCase();
      const email = document.getElementById("loginEmail").value.trim().toLowerCase();
      const btn = document.getElementById("btnLogin");

      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Memverifikasi...`;

      try {
        const response = await fetch(`${SCRIPT_URL}?action=getAssignedStores&implId=${encodeURIComponent(implId)}&email=${encodeURIComponent(email)}`);
        const result = await response.json();

        if (result.status === "success") {
          state.implId = implId;
          state.email = email;
          state.userName = result.userName;
          state.stores = result.data || [];

          document.getElementById("loginSection").classList.add("hidden");
          document.getElementById("dashboardSection").classList.remove("hidden");
          document.getElementById("userDisplayName").innerText = state.userName;
          document.getElementById("userDisplayId").innerText = `ID: ${state.implId} | ${state.email}`;

          renderStoreList();
          showAlert(`Selamat datang, ${state.userName}!`);
        } else {
          showAlert(result.message || "Login gagal.", false);
        }
      } catch (err) {
        showAlert("Gagal terhubung ke Apps Script. Pastikan Deploy sudah 'Anyone'.", false);
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<span>Masuk Portal</span><i class="fa-solid fa-arrow-right"></i>`;
      }
    }

    function handleLogout() {
      state = { implId: "", email: "", userName: "", stores: [] };
      document.getElementById("dashboardSection").classList.add("hidden");
      document.getElementById("loginSection").classList.remove("hidden");
      document.getElementById("loginForm").reset();
    }

    function renderStoreList() {
      const grid = document.getElementById("storeListGrid");
      const filter = document.getElementById("searchInput").value.toLowerCase();
      grid.innerHTML = "";

      const filtered = state.stores.filter(s => 
        s.storeName.toLowerCase().includes(filter) || 
        s.storeCode.toLowerCase().includes(filter) ||
        s.oid.toLowerCase().includes(filter)
      );

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400 font-medium">Tidak ada toko penugasan yang ditemukan.</div>`;
        return;
      }

      filtered.forEach(s => {
        const dtMapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent([s.dtName, s.dtAddress].filter(v => v !== "-").join(" "))}`;
        const storeMapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent([s.storeName, s.storeAddress].filter(v => v !== "-").join(" "))}`;

        const card = document.createElement("div");
        card.className = "bg-white rounded-2xl p-5 border border-slate-200 shadow-sm flex flex-col justify-between space-y-3";
        card.innerHTML = `
          <div>
            <div class="flex justify-between items-start gap-2 mb-2">
              <div>
                <span class="text-xs font-bold text-blue-600 bg-blue-50 px-2.5 py-1 rounded-lg">${s.storeCode}</span>
                <span class="text-xs font-mono text-slate-400 ml-1">OID: ${s.oid}</span>
              </div>
              <span class="text-[10px] font-extrabold uppercase px-2 py-0.5 rounded-full bg-slate-100 text-slate-700 border">
                ${s.status}
              </span>
            </div>
            
            <h3 class="font-bold text-slate-900 text-base line-clamp-1">${s.storeName}</h3>
            
            <div class="text-xs text-slate-600 space-y-1 mt-2">
              <p>📍 <b>Alamat Toko:</b> ${s.storeAddress} <a href="${storeMapsUrl}" target="_blank" class="text-blue-600 font-bold ml-1 hover:underline">🗺️ Maps Toko</a></p>
              <p>🚚 <b>Distributor:</b> ${s.dtName} (${s.dtCode})</p>
              <p>🏢 <b>Alamat DT:</b> ${s.dtAddress} ${s.dtAddress !== "-" ? `<a href="${dtMapsUrl}" target="_blank" class="text-indigo-600 font-bold ml-1 hover:underline">🗺️ Maps DT</a>` : ''}</p>
              <p>👤 <b>ASM:</b> ${s.asmName} ${s.asmPhone ? `(${s.asmPhone})` : ''}</p>
            </div>
          </div>

          <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-100 text-[11px] text-slate-500 space-y-1">
            <div class="flex justify-between"><span>Package:</span><b class="text-slate-700">${s.devicePackage}</b></div>
            <div class="flex justify-between"><span>SLA Imp:</span><b class="text-slate-700">${s.slaImplementation}</b></div>
            <div class="flex justify-between"><span>Travel Fee:</span><b class="text-amber-600">${s.travelStatus}</b></div>
          </div>

          <div class="grid grid-cols-3 gap-2 pt-1 border-t border-slate-100">
            <button onclick="openModalAbsen('${s.storeCode}', '${escapeHtml(s.storeName)}', '${s.oid}')" class="bg-blue-50 hover:bg-blue-100 text-blue-700 font-bold py-2 rounded-xl text-xs flex flex-col items-center gap-1">
              <i class="fa-solid fa-location-dot"></i> Absen
            </button>
            <button onclick="openModalBAST('${s.storeCode}', '${escapeHtml(s.storeName)}', '${s.oid}')" class="bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-bold py-2 rounded-xl text-xs flex flex-col items-center gap-1">
              <i class="fa-solid fa-file-contract"></i> BAST
            </button>
            <button onclick="openModalTravel('${s.storeCode}', '${escapeHtml(s.storeName)}', '${escapeHtml(s.storeAddress)}')" class="bg-amber-50 hover:bg-amber-100 text-amber-700 font-bold py-2 rounded-xl text-xs flex flex-col items-center gap-1">
              <i class="fa-solid fa-car"></i> Travel Fee
            </button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function escapeHtml(text) {
      return (text || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    function openModalAbsen(code, name, oid) {
      document.getElementById("absenStoreCode").value = code;
      document.getElementById("absenStoreName").value = name;
      document.getElementById("absenOid").value = oid;
      document.getElementById("modalAbsen").classList.remove("hidden");
    }

    function openModalBAST(code, name, oid) {
      document.getElementById("bastStoreCode").value = code;
      document.getElementById("bastStoreName").value = name;
      document.getElementById("bastOid").value = oid;
      document.getElementById("modalBAST").classList.remove("hidden");
    }

    function openModalTravel(code, name, address) {
      document.getElementById("travelStoreCode").value = code;
      document.getElementById("travelStoreName").value = name;
      document.getElementById("travelStoreAddress").value = address;
      document.getElementById("modalTravel").classList.remove("hidden");
    }

    function closeModal(id) { document.getElementById(id).classList.add("hidden"); }

    // SINKRON POST HANDLER
    async function postData(payload) {
      return fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      }).then(res => res.json());
    }

    async function submitAbsen(e) {
      e.preventDefault();
      const btn = document.getElementById("btnSubmitAbsen");
      btn.disabled = true; btn.innerText = "Mengirim...";

      try {
        const photoFile = document.getElementById("absenPhoto").files[0];
        const payload = {
          action: "submitAbsen",
          email: state.email,
          implId: state.implId,
          storeCode: document.getElementById("absenStoreCode").value,
          storeName: document.getElementById("absenStoreName").value,
          oid: document.getElementById("absenOid").value,
          activity: document.getElementById("absenActivity").value,
          notes: document.getElementById("absenNotes").value,
          workingDate: document.getElementById("absenWorkingDate").value,
          photoIn: photoFile ? await toBase64(photoFile) : ""
        };

        const result = await postData(payload);
        if (result.status === "success") {
          showAlert("Absen Visit berhasil tersimpan!");
          closeModal("modalAbsen");
          document.getElementById("formAbsen").reset();
        } else {
          showAlert(result.message, false);
        }
      } catch (err) {
        showAlert("Gagal mengirim data Absen.", false);
      } finally {
        btn.disabled = false; btn.innerText = "Kirim Absen";
      }
    }

    async function submitBAST(e) {
      e.preventDefault();
      const btn = document.getElementById("btnSubmitBAST");
      btn.disabled = true; btn.innerText = "Mengirim...";

      try {
        const photoStoreFile = document.getElementById("bastPhotoStore").files[0];
        const bastDocFile = document.getElementById("bastFile").files[0];

        const payload = {
          action: "submitBAST",
          email: state.email,
          implId: state.implId,
          storeCode: document.getElementById("bastStoreCode").value,
          storeName: document.getElementById("bastStoreName").value,
          oid: document.getElementById("bastOid").value,
          merchantName: document.getElementById("bastMerchantName").value,
          merchantPhone: document.getElementById("bastMerchantPhone").value,
          merchantEmail: document.getElementById("bastMerchantEmail").value,
          merchantGender: document.getElementById("bastMerchantGender").value,
          merchantAge: document.getElementById("bastMerchantAge").value,
          imei: document.getElementById("bastImei").value,
          scannerSn: document.getElementById("bastScannerSn").value,
          printerSn: document.getElementById("bastPrinterSn").value,
          visitDate: document.getElementById("bastVisitDate").value,
          photoStore: photoStoreFile ? await toBase64(photoStoreFile) : "",
          bastFile: bastDocFile ? await toBase64(bastDocFile) : ""
        };

        const result = await postData(payload);
        if (result.status === "success") {
          showAlert("Data BAST berhasil tersimpan!");
          closeModal("modalBAST");
          document.getElementById("formBAST").reset();
        } else {
          showAlert(result.message, false);
        }
      } catch (err) {
        showAlert("Gagal mengirim data BAST.", false);
      } finally {
        btn.disabled = false; btn.innerText = "Simpan BAST";
      }
    }

    async function submitTravelFee(e) {
      e.preventDefault();
      const btn = document.getElementById("btnSubmitTravel");
      btn.disabled = true; btn.innerText = "Mengirim...";

      try {
        const payload = {
          action: "submitTravelFee",
          implName: state.userName,
          implId: state.implId,
          storeCode: document.getElementById("travelStoreCode").value,
          storeName: document.getElementById("travelStoreName").value,
          storeAddress: document.getElementById("travelStoreAddress").value,
          implAddress: document.getElementById("travelImplAddress").value,
          implCity: document.getElementById("travelImplCity").value,
          distance: document.getElementById("travelDistance").value,
          proposalBudget: document.getElementById("travelBudget").value
        };

        const result = await postData(payload);
        if (result.status === "success") {
          showAlert("Pengajuan Travel Fee berhasil terkirim!");
          const idx = state.stores.findIndex(s => s.storeCode === payload.storeCode);
          if (idx !== -1) state.stores[idx].travelStatus = "Pending";
          renderStoreList();
          closeModal("modalTravel");
          document.getElementById("formTravel").reset();
        } else {
          showAlert(result.message, false);
        }
      } catch (err) {
        showAlert("Gagal mengajukan Travel Fee.", false);
      } finally {
        btn.disabled = false; btn.innerText = "Ajukan Travel Fee";
      }
    }
  </script>
</body>
</html>
